<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 수정 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .card-header { background: #0f3460; color: #fff; font-weight: 600; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 0.25rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">홈</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/products}">상품 목록</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 600px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-header py-3">
            <h5 class="mb-0">📦 상품 정보 수정</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/products/{id}/edit(id=${productId})}" th:object="${productDto}" method="post">

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">상품명</label>
                    <input type="text" th:field="*{name}" id="name" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label fw-semibold">가격 (원)</label>
                    <input type="number" th:field="*{price}" id="price" class="form-control"
                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                    <div class="error-msg" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>

                <div class="mb-3">
                    <label for="stock" class="form-label fw-semibold">재고 수량</label>
                    <input type="number" th:field="*{stock}" id="stock" class="form-control"
                           th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
                    <div class="error-msg" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold">상품 설명</label>
                    <textarea th:field="*{description}" id="description" rows="4" class="form-control"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">수정 완료</button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary px-4">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div style="text-align: center; margin: 40px 0;">
    <hr style="border: 0; height: 1px; background: #ccc; margin-bottom: 15px;">
    <p th:text="${' 학번: 2371336  │  성명: 김선우 │ 실습 수행: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></p>
</div>

</body>
</html>
