<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-header { background: #222831; color: #fff; font-weight: 600; }
        .error-msg { color: #dc3545; font-size: 0.85rem; margin-top: 0.25rem; }
    </style>
</head>
<body>
<div class="container" style="max-width: 550px; margin-top: 70px;">
    <div class="card border-0 shadow-sm">
        <div class="card-header py-3 text-center">
            <h5 class="mb-0">🔒 비밀번호 변경</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/user/password}"
                  th:object="${passwordChangeDto}"
                  method="post">

            <div class="mb-3">
                <label for="currentPassword" class="form-label fw-semibold">현재 비밀번호</label>
                <input type="password" th:field="*{currentPassword}" id="currentPassword" class="form-control" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                <div class="error-msg" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label fw-semibold">새 비밀번호 (8자 이상)</label>
                <input type="password" th:field="*{newPassword}" id="newPassword" class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                <div class="error-msg" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">새 비밀번호 확인</label>
                <input type="password" th:field="*{confirmPassword}" id="confirmPassword" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                <div class="error-msg" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-dark fw-semibold">비밀번호 변경하기</button>
                <a th:href="@{/home}" class="btn btn-outline-secondary">취소</a>
            </div>
            </form>
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <hr style="border: 0; height: 1px; background: #ccc; margin-bottom: 15px;">
        <p style="font-size: 0.9rem; color: #495057;" th:text="${'학번: 2371336  │  성명: 김선우 │ 실습 수행: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></p>
    </div>
</div>
</body>
</html>
